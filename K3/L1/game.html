<!DOCTYPE html>

<head>

    <!-- Tailwind CSS -->

    <!-- 大陸境內穩定 BootCDN 鏡像套件 -->
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- 透過大陸可用節點載入 Quicksand SemiBold 600 字體（避免被阻斷的 Google Fonts） -->

    <link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/@fontsource/quicksand@5.0.16/700.css">
    <script src="https://cdn.bootcdn.net/ajax/libs/canvas-confetti/1.9.2/confetti.browser.min.js"></script>
    <script>
        /**
         * 騰訊雲上海 COS 媒體資源路徑設定（中國大陸境內高速直連）
         */
        const MEDIA_BASE_URL = 'https://mks-video-1414086886.cos.ap-shanghai.myqcloud.com/K3/L1-2/';

        /**
         * 圖片備援機制：定義於 <head> 以確保 <img> 載入失敗觸發 onerror 時函式已就緒
         */
        function handleImageFallback(imgElement) {
            imgElement.onerror = null; // 防止無限觸發
            const svgScene = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 647" width="1024" height="647">
                <!-- Ceiling (天花板 y: 0~48) -->
                <rect x="0" y="0" width="1024" height="45" fill="#F8FAFC"/>
                <line x1="0" y1="45" x2="1024" y2="45" stroke="#CBD5E1" stroke-width="4"/>
                
                <!-- Walls (米黃色牆面) -->
                <rect x="0" y="45" width="1024" height="295" fill="#FEF9C3"/>
                <line x1="65" y1="45" x2="65" y2="340" stroke="#FDE047" stroke-width="2"/>
                
                <!-- Floor (薄荷綠地板 y: 340~647) -->
                <rect x="0" y="340" width="1024" height="307" fill="#D1FAE5"/>

                <!-- Whiteboard (白板) -->
                <rect x="135" y="115" width="245" height="150" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="4"/>
                
                <!-- Door (門 x:565, y:112, w:105, h:228) -->
                <rect x="565" y="112" width="105" height="228" fill="#E0F2FE" stroke="#94A3B8" stroke-width="3"/>
                <rect x="573" y="120" width="89" height="22" fill="#BAE6FD" stroke="#94A3B8" stroke-width="2"/>
                <rect x="573" y="150" width="89" height="190" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
                <rect x="583" y="162" width="69" height="85" fill="#E0F2FE" stroke="#CBD5E1" stroke-width="2"/>
                <circle cx="652" cy="258" r="5" fill="#FACC15" stroke="#CA8A04" stroke-width="1.5"/>

                <!-- Light (吊燈 x:722, y:45~110) -->
                <line x1="722" y1="45" x2="722" y2="72" stroke="#475569" stroke-width="3"/>
                <path d="M690 95 Q722 60 754 95 Z" fill="#5EEAD4" stroke="#0F766E" stroke-width="2"/>
                <circle cx="722" cy="97" r="7" fill="#FEF08A" stroke="#EAB308" stroke-width="1.5"/>

                <!-- Window (窗戶 x:772, y:122, w:205, h:115) -->
                <rect x="772" y="122" width="205" height="115" fill="#BAE6FD" stroke="#94A3B8" stroke-width="4"/>
                <circle cx="945" cy="155" r="24" fill="#FDE047"/>
                <line x1="772" y1="135" x2="977" y2="135" stroke="#64748B" stroke-width="2"/>
                <line x1="772" y1="145" x2="977" y2="145" stroke="#64748B" stroke-width="2"/>
                <line x1="772" y1="155" x2="977" y2="155" stroke="#64748B" stroke-width="2"/>

                <!-- Cabinets & Sink (櫃子與洗手台 x:868, y:248) -->
                <rect x="190" y="275" width="350" height="65" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
                <rect x="735" y="275" width="289" height="65" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
                <!-- Sink Basin & Faucet -->
                <rect x="868" y="268" width="86" height="18" rx="4" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
                <path d="M911 268 L911 248 Q911 240 920 245" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round"/>

                <!-- Foreground Desks (橘色圓桌增加場景層次) -->
                <ellipse cx="215" cy="525" rx="185" ry="62" fill="#FB923C" stroke="#C2410C" stroke-width="3"/>
                <ellipse cx="920" cy="465" rx="165" ry="55" fill="#FB923C" stroke="#C2410C" stroke-width="3"/>

                <!-- Butterflies (點綴蝴蝶) -->
                <text x="860" y="50" font-size="22">🦋</text>
                <text x="610" y="210" font-size="20">🦋</text>
                <text x="245" y="185" font-size="22">🦋</text>
            <\/svg>`;
            imgElement.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgScene);
        }
    </script>

    <style>
        body {
            /* 優先使用 Quicksand SemiBold 600，搭配本地圓體與無襯線字體備援 */
            font-family: 'Quicksand', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-weight: 600;
            background: linear-gradient(135deg, #FFFBEB 0%, #FEF3C7 50%, #E0F2FE 100%);
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
            overflow: hidden;
        }

        /* 互動熱區樣式 (加大電子白板觸控感應範圍) */
        .hotspot {
            position: absolute;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            background-color: rgba(255, 255, 255, 0);
            border: 3px solid transparent;
            touch-action: manipulation;
            z-index: 10;
        }

        /* 探索模式或懸停時的微亮提示 */
        .game-active .hotspot:hover {
            background-color: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        /* 提示閃爍動畫 */
        @keyframes hintPulse {
            0%, 100% {
                background-color: rgba(250, 204, 21, 0.15);
                border-color: rgba(250, 204, 21, 0.9);
                box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.7);
            }
            50% {
                background-color: rgba(250, 204, 21, 0.45);
                border-color: rgba(250, 204, 21, 1);
                box-shadow: 0 0 25px 8px rgba(250, 204, 21, 0.6);
            }
        }

        .hint-active {
            animation: hintPulse 1.2s infinite ease-in-out !important;
            z-index: 20;
        }

        /* 答對時的彈跳與發光效果 */
        @keyframes correctPop {
            0% { transform: scale(0.95); background-color: rgba(34, 197, 94, 0.5); border-color: #22c55e; }
            50% { transform: scale(1.04); background-color: rgba(34, 197, 94, 0.3); border-color: #4ade80; box-shadow: 0 0 30px #22c55e; }
            100% { transform: scale(1); background-color: rgba(34, 197, 94, 0.15); border-color: #22c55e; }
        }

        .hotspot-found {
            animation: correctPop 0.6s ease-out forwards;
            border: 4px dashed #22c55e !important;
            background-color: rgba(34, 197, 94, 0.15) !important;
        }

        /* 答錯時的左右搖晃效果 */
        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .shake-error {
            animation: wrongShake 0.4s ease-in-out;
        }

        /* 答錯時的紅色閃光邊框特效 */
        @keyframes wrongFlash {
            0%, 100% { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); border-color: #ffffff; }
            35% { box-shadow: 0 0 35px 8px rgba(244, 63, 94, 0.65); border-color: #f43f5e; }
        }

        .board-error-flash {
            animation: wrongShake 0.4s ease-in-out, wrongFlash 0.6s ease-out;
        }

        /* 答對時的綠色光芒脈衝特效 */
        @keyframes boardSuccessGlow {
            0%, 100% { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); border-color: #ffffff; }
            40% { box-shadow: 0 0 40px 10px rgba(34, 197, 94, 0.65); border-color: #4ade80; }
        }

        .board-success-glow {
            animation: boardSuccessGlow 0.7s ease-out;
        }

        /* 點擊處星光擴散波紋特效 */
        @keyframes rippleBurst {
            0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2.4); opacity: 0; }
        }

        .click-burst-ring {
            position: absolute;
            width: 56px;
            height: 56px;
            border-radius: 9999px;
            pointer-events: none;
            z-index: 45;
            animation: rippleBurst 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* 3D 遊戲按鈕樣式 */
        .btn-3d {
            transition: all 0.1s ease;
            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.2);
            touch-action: manipulation;
        }
        .btn-3d:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body class="h-[100dvh] w-screen overflow-hidden flex flex-col items-center justify-between p-2 sm:p-3 gap-2">

    <!-- 頂部控制與選題橫幅 (置於畫面上方，維持單頁免捲動) -->

    <main class="w-full flex-1 min-h-0 min-w-0 flex items-center justify-center">

                    <div class="flex flex-wrap justify-center gap-3">

    <script>
        const AUDIO_BASE_URL = MEDIA_BASE_URL;

        const STAGES = {
            1: {
                id: 1,
                name: 'Stage 1',
                bgUrl: MEDIA_BASE_URL + 'background-1.png',
                hotspots: {
                    ceiling: { top: '0%', left: '0%', width: '100%', height: '7.2%', borderRadius: '12px' },
                    light:   { top: '5.5%', left: '67%', width: '7.2%', height: '10.5%', borderRadius: '50%' },
                    door:    { top: '17.2%', left: '55.3%', width: '10.6%', height: '35.8%', borderRadius: '12px' },
                    window:  { top: '18.8%', left: '75.2%', width: '20.2%', height: '18.2%', borderRadius: '12px' },
                    sink:    { top: '38.2%', left: '84.8%', width: '8.6%', height: '8.2%', borderRadius: '12px' }
                },
                labels: {
                    door:    { labelX: 60.6, labelY: 35.0 },
                    ceiling: { labelX: 48.0, labelY: 3.8  },
                    light:   { labelX: 70.6, labelY: 11.0 },
                    sink:    { labelX: 89.1, labelY: 42.3 },
                    floor:   { labelX: 52.0, labelY: 82.0 },
                    window:  { labelX: 85.3, labelY: 27.9 }
                }
            },
            2: {
                id: 2,
                name: 'Stage 2',
                bgUrl: MEDIA_BASE_URL + 'background-2.png',
                hotspots: {
                    ceiling: { top: '0%', left: '0%', width: '100%', height: '8.5%', borderRadius: '12px' },
                    light:   { top: '1.2%', left: '44.5%', width: '11%', height: '9.5%', borderRadius: '50%' },
                    door:    { top: '14%', left: '1.5%', width: '19%', height: '69%', borderRadius: '12px' },
                    window:  { top: '18%', left: '63.5%', width: '21.5%', height: '33%', borderRadius: '12px' },
                    sink:    { top: '52%', left: '72%', width: '18%', height: '21.5%', borderRadius: '16px' }
                },
                labels: {
                    door:    { labelX: 11.0, labelY: 48.0 },
                    ceiling: { labelX: 25.0, labelY: 4.5  },
                    light:   { labelX: 50.0, labelY: 6.5  },
                    sink:    { labelX: 81.0, labelY: 62.5 },
                    floor:   { labelX: 48.0, labelY: 91.0 },
                    window:  { labelX: 74.0, labelY: 34.5 }
                }
            }
        };

        const VOCABULARY = [
            { id: 'door',    word: 'door',    audio: 'door.mp3'    },
            { id: 'ceiling', word: 'ceiling', audio: 'ceiling.mp3' },
            { id: 'light',   word: 'light',   audio: 'light.mp3'   },
            { id: 'sink',    word: 'sink',    audio: 'sink.mp3'    },
            { id: 'floor',   word: 'floor',   audio: 'floor.mp3'   },
            { id: 'window',  word: 'window',  audio: 'window.mp3'  }
        ];

        const PRAISE_FILES = ['good job.mp3', 'great.mp3', 'way to go.mp3'];

        const state = {
            currentStage: 1,
            queue: [],
            currentTarget: null,
            foundWords: new Set(),
            attempts: 0,
            correctCount: 0,
            isProcessing: false,
            audioCtx: null,
            currentAudio: null,
            floorMask: null,
            maskWidth: 1024,
            maskHeight: 647
        };

        /**
         * 初始化離屏 Canvas 像素顏色識別系統，動態採樣並偵測各關卡的地板區域
         */
        function initFloorColorDetection() {
            const img = document.getElementById('classroomImg');
            const highlightCanvas = document.getElementById('floorHighlightCanvas');
            if (!img || !highlightCanvas) return;

            const processImage = () => {
                try {
                    const w = state.maskWidth;
                    const h = state.maskHeight;
                    const offCanvas = document.createElement('canvas');
                    offCanvas.width = w;
                    offCanvas.height = h;
                    const offCtx = offCanvas.getContext('2d');
                    offCtx.drawImage(img, 0, 0, w, h);

                    const imgData = offCtx.getImageData(0, 0, w, h).data;
                    const hCtx = highlightCanvas.getContext('2d');
                    const hImgData = hCtx.createImageData(w, h);
                    const outData = hImgData.data;
                    const mask = new Uint8Array(w * h);

                    // 動態採樣底部開放地板區塊取得該關卡實際地板主色調
                    const sampleXStart = state.currentStage === 2 ? 0.04 : 0.42;
                    const sampleXEnd   = state.currentStage === 2 ? 0.24 : 0.62;
                    const sampleYStart = state.currentStage === 2 ? 0.85 : 0.86;
                    const sampleYEnd   = state.currentStage === 2 ? 0.96 : 0.96;

                    let sumR = 0, sumG = 0, sumB = 0, sampleCount = 0;
                    for (let sy = Math.floor(h * sampleYStart); sy < Math.floor(h * sampleYEnd); sy++) {
                        for (let sx = Math.floor(w * sampleXStart); sx < Math.floor(w * sampleXEnd); sx++) {
                            const sIdx = (sy * w + sx) * 4;
                            sumR += imgData[sIdx];
                            sumG += imgData[sIdx + 1];
                            sumB += imgData[sIdx + 2];
                            sampleCount++;
                        }
                    }

                    const baseR = sampleCount > 0 ? sumR / sampleCount : 185;
                    const baseG = sampleCount > 0 ? sumG / sampleCount : 215;
                    const baseB = sampleCount > 0 ? sumB / sampleCount : 195;

                    let detectedPixels = 0;
                    const minFloorY = state.currentStage === 2 ? h * 0.72 : h * 0.49;

                    for (let y = 0; y < h; y++) {
                        if (y < minFloorY) continue;

                        for (let x = 0; x < w; x++) {
                            // Stage 2 右下角為流理台木櫃 (x > 71%)，予以排除
                            if (state.currentStage === 2 && x > w * 0.71) continue;

                            const idx = (y * w + x) * 4;
                            const r = imgData[idx];
                            const g = imgData[idx + 1];
                            const b = imgData[idx + 2];

                            const colorDist = Math.sqrt(
                                Math.pow(r - baseR, 2) +
                                Math.pow(g - baseG, 2) +
                                Math.pow(b - baseB, 2)
                            );
                            const isOrangeDesk = state.currentStage === 1 && (r - b) > 45 && r > 200;

                            if (colorDist < 55 && !isOrangeDesk) {
                                mask[y * w + x] = 1;
                                detectedPixels++;
                                outData[idx] = 34;      // R (Emerald-500)
                                outData[idx + 1] = 197; // G
                                outData[idx + 2] = 94;  // B
                                outData[idx + 3] = 95;  // Alpha
                            }
                        }
                    }

                    // 若偵測到的有效地板像素過少，自動切換為幾何區域備援
                    if (detectedPixels < (w * h * 0.05)) {
                        state.floorMask = null;
                        hCtx.clearRect(0, 0, w, h);
                    } else {
                        state.floorMask = mask;
                        hCtx.putImageData(hImgData, 0, 0);
                    }
                } catch (err) {
                    // 若跨域圖片讀取像素受限，啟用幾何高度備援判定
                    state.floorMask = null;
                }
            };

            if (img.complete && img.naturalWidth > 0) {
                processImage();
            }
            img.onload = processImage;
        }

        /**
         * 檢查點擊座標是否落在識別出的地板像素區域內 (5x5 鄰域多數決)
         */
        function checkFloorAtPoint(clientX, clientY) {
            const board = document.getElementById('gameBoard');
            if (!board) return false;

            const rect = board.getBoundingClientRect();
            const relX = (clientX - rect.left) / rect.width;
            const relY = (clientY - rect.top) / rect.height;

            if (relX < 0 || relX > 1 || relY < 0 || relY > 1) return false;

            // 若無像素遮罩資料，使用下半部安全區域備援
            if (!state.floorMask) {
                if (state.currentStage === 2) {
                    return relY >= 0.75 && relX <= 0.71;
                }
                return relY >= 0.54;
            }

            const cx = Math.floor(relX * state.maskWidth);
            const cy = Math.floor(relY * state.maskHeight);
            let hits = 0;
            let samples = 0;

            for (let dy = -2; dy <= 2; dy++) {
                for (let dx = -2; dx <= 2; dx++) {
                    const sx = cx + dx;
                    const sy = cy + dy;
                    if (sx >= 0 && sx < state.maskWidth && sy >= 0 && sy < state.maskHeight) {
                        samples++;
                        if (state.floorMask[sy * state.maskWidth + sx] === 1) {
                            hits++;
                        }
                    }
                }
            }

            return samples > 0 && (hits / samples) >= 0.4;
        }

        /**
         * 依序播放多個 MP3 音效檔，全部播完後執行 onComplete
         */
        function playAudioSequence(fileList, onComplete) {
            if (state.currentAudio) {
                state.currentAudio.pause();
                state.currentAudio = null;
            }

            let index = 0;
            const playNext = () => {
                if (index >= fileList.length) {
                    state.currentAudio = null;
                    if (typeof onComplete === 'function') onComplete();
                    return;
                }

                const fileName = fileList[index++];
                const audio = new Audio(AUDIO_BASE_URL + encodeURIComponent(fileName));
                state.currentAudio = audio;

                audio.onended = playNext;
                audio.onerror = () => {
                    if (fileName === 'correct.mp3') playSoundEffect('correct');
                    else if (fileName === 'error.mp3') playSoundEffect('wrong');
                    playNext();
                };

                audio.play().catch(() => {
                    if (fileName === 'correct.mp3') playSoundEffect('correct');
                    else if (fileName === 'error.mp3') playSoundEffect('wrong');
                    playNext();
                });
            };

            playNext();
        }

        /**
         * 播放目前題目單字的 MP3 發音 (備援使用瀏覽器英語語音合成)
         */
        function speakCurrentWord() {
            if (!state.currentTarget) return;
            const target = state.currentTarget;

            if (state.currentAudio) {
                state.currentAudio.pause();
                state.currentAudio = null;
            }

            const audio = new Audio(AUDIO_BASE_URL + encodeURIComponent(target.audio));
            state.currentAudio = audio;

            audio.onerror = () => fallbackSpeech(target.word);
            audio.play().catch(() => fallbackSpeech(target.word));
        }

        /**
         * 瀏覽器內建英語單字朗讀備援
         */
        function fallbackSpeech(word) {
            try {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utter = new SpeechSynthesisUtterance(word);
                    utter.lang = 'en-US';
                    utter.rate = 0.9;
                    window.speechSynthesis.speak(utter);
                }
            } catch (e) {
                // 忽略不支援語音合成的環境
            }
        }

        /**
         * 頁面載入後初始化所有元件與監聽器
         */
        function init() {
            renderStars();
            renderWordCards();
            setupHotspotListeners();
            initFloorColorDetection();
        }

        // 啟動初始化
        window.onload = init;

        /**
         * 切換關卡 (Stage 1 / Stage 2)
         */
        function switchStage(stageId) {
            if (!STAGES[stageId]) return;
            if (state.currentAudio) {
                state.currentAudio.pause();
                state.currentAudio = null;
            }
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            state.currentStage = stageId;

            const stageConfig = STAGES[stageId];
            const img = document.getElementById('classroomImg');
            if (img) {
                img.src = stageConfig.bgUrl;
            }

            // 更新關卡按鈕樣式
            const btn1 = document.getElementById('stageBtn1');
            const btn2 = document.getElementById('stageBtn2');
            if (btn1 && btn2) {
                if (stageId === 1) {
                    btn1.className = 'px-2.5 py-1 rounded-lg font-bold text-xs sm:text-sm transition-all bg-amber-500 text-white shadow-xs';
                    btn2.className = 'px-2.5 py-1 rounded-lg font-bold text-xs sm:text-sm transition-all text-amber-800 hover:bg-amber-200/60';
                } else {
                    btn2.className = 'px-2.5 py-1 rounded-lg font-bold text-xs sm:text-sm transition-all bg-amber-500 text-white shadow-xs';
                    btn1.className = 'px-2.5 py-1 rounded-lg font-bold text-xs sm:text-sm transition-all text-amber-800 hover:bg-amber-200/60';
                }
            }

            // 套用該關卡的熱區座標
            document.querySelectorAll('.hotspot').forEach(el => {
                const word = el.dataset.word;
                const pos = stageConfig.hotspots[word];
                if (pos) {
                    el.style.top = pos.top;
                    el.style.left = pos.left;
                    el.style.width = pos.width;
                    el.style.height = pos.height;
                    el.style.borderRadius = pos.borderRadius || '12px';
                }
            });

            startGame();
        }

        /**
         * 開始或重新開始目前關卡
         */
        function startGame() {
            if (state.currentAudio) {
                state.currentAudio.pause();
                state.currentAudio = null;
            }
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            state.foundWords.clear();
            state.attempts = 0;
            state.correctCount = 0;
            state.isProcessing = false;
            state.currentTarget = null;

            // 隱藏遮罩層
            const startOverlay = document.getElementById('startOverlay');
            const victoryOverlay = document.getElementById('victoryOverlay');
            if (startOverlay) startOverlay.classList.add('hidden');
            if (victoryOverlay) victoryOverlay.classList.add('hidden');

            // 顯示上方提示面板並啟用互動狀態
            const promptPanel = document.getElementById('promptPanel');
            if (promptPanel) promptPanel.classList.remove('hidden');

            const board = document.getElementById('gameBoard');
            if (board) board.classList.add('game-active');

            // 清除舊標籤與熱區狀態
            const labelsLayer = document.getElementById('labelsLayer');
            if (labelsLayer) labelsLayer.innerHTML = '';

            document.querySelectorAll('.hotspot').forEach(el => {
                el.classList.remove('hotspot-found', 'hint-active');
            });

            const floorCanvas = document.getElementById('floorHighlightCanvas');
            if (floorCanvas) floorCanvas.style.opacity = '0';

            renderStars();
            renderWordCards();

            // 保持初始提示狀態，等待老師點選下方單字卡後再播放發音
            const display = document.getElementById('targetWordDisplay');
            if (display) {
                display.textContent = 'Select a word';
            }
        }

        /**
         * 老師點選下方單字卡設定目前題目
         */
        function selectWordByTeacher(wordId) {
            if (state.isProcessing) return;
            const vocab = VOCABULARY.find(v => v.id === wordId);
            if (!vocab) return;

            state.currentTarget = vocab;

            const display = document.getElementById('targetWordDisplay');
            if (display) {
                display.textContent = vocab.word;
            }

            renderWordCards();
            speakCurrentWord();
        }

        /**
         * 渲染頂部 6 顆進度星星
         */
        function renderStars() {
            const container = document.getElementById('starsContainer');
            if (!container) return;
            container.innerHTML = '';

            VOCABULARY.forEach(item => {
                const isFound = state.foundWords.has(item.id);
                const star = document.createElement('i');
                star.className = isFound
                    ? 'fa-solid fa-star text-amber-400 text-sm sm:text-base drop-shadow-xs transition-transform scale-110'
                    : 'fa-solid fa-star text-slate-300 text-sm sm:text-base transition-transform';
                container.appendChild(star);
            });
        }

        /**
         * 渲染老師操作用單字卡片列
         */
        function renderWordCards() {
            const bar = document.getElementById('wordCardsBar');
            if (!bar) return;
            bar.innerHTML = '';

            VOCABULARY.forEach(item => {
                const isSelected = state.currentTarget && state.currentTarget.id === item.id;
                const isFound = state.foundWords.has(item.id);

                const btn = document.createElement('button');
                btn.type = 'button';

                let baseClasses = 'btn-3d rounded-xl px-2 py-1.5 sm:py-2 font-bold text-sm sm:text-base flex items-center justify-center gap-1.5 border-2 transition-all ';
                if (isSelected) {
                    baseClasses += 'bg-sky-500 text-white border-sky-600 scale-[1.02]';
                } else if (isFound) {
                    baseClasses += 'bg-emerald-50 text-emerald-700 border-emerald-300 hover:bg-emerald-100';
                } else {
                    baseClasses += 'bg-white text-slate-700 border-slate-200 hover:border-sky-300 hover:bg-sky-50';
                }
                btn.className = baseClasses;

                const iconClass = isFound ? 'fa-solid fa-circle-check text-emerald-500' : 'fa-solid fa-volume-high';
                const activeIconClass = isSelected ? 'fa-solid fa-volume-high text-white' : iconClass;

                btn.innerHTML = `<i class="${activeIconClass} text-xs sm:text-sm"></i><span>${item.word}</span>`;

                const handleSelect = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    selectWordByTeacher(item.id);
                };

                btn.addEventListener('click', handleSelect);
                btn.addEventListener('touchend', handleSelect, { passive: false });
                bar.appendChild(btn);
            });
        }

        /**
         * 設定電子白板觸控與滑鼠點擊監聽
         */
        function setupHotspotListeners() {
            const board = document.getElementById('gameBoard');
            if (!board) return;

            let lastTouchTime = 0;

            const handleInput = (clientX, clientY, targetEl) => {
                if (!state.currentTarget || state.isProcessing) return;

                const hotspotEl = targetEl.closest('.hotspot');
                if (hotspotEl) {
                    const clickedWord = hotspotEl.dataset.word;
                    if (clickedWord === state.currentTarget.id) {
                        handleCorrectAnswer(state.currentTarget, clientX, clientY, hotspotEl);
                    } else {
                        handleWrongAnswer(clientX, clientY);
                    }
                    return;
                }

                // 檢查是否點到地板區域
                if (state.currentTarget.id === 'floor' && checkFloorAtPoint(clientX, clientY)) {
                    handleCorrectAnswer(state.currentTarget, clientX, clientY, null);
                } else {
                    handleWrongAnswer(clientX, clientY);
                }
            };

            board.addEventListener('touchend', (e) => {
                if (e.target.closest('#startOverlay') || e.target.closest('#victoryOverlay')) return;
                if (e.changedTouches && e.changedTouches.length > 0) {
                    lastTouchTime = Date.now();
                    e.preventDefault();
                    const touch = e.changedTouches[0];
                    handleInput(touch.clientX, touch.clientY, e.target);
                }
            }, { passive: false });

            board.addEventListener('click', (e) => {
                if (Date.now() - lastTouchTime < 450) return;
                if (e.target.closest('#startOverlay') || e.target.closest('#victoryOverlay')) return;
                handleInput(e.clientX, e.clientY, e.target);
            });
        }

        /**
         * 處理答對時的視覺特效、音效與進度更新
         */
        function handleCorrectAnswer(target, clientX, clientY, hotspotEl) {
            state.isProcessing = true;
            state.attempts++;
            state.correctCount++;

            const isFirstTimeFound = !state.foundWords.has(target.id);
            state.foundWords.add(target.id);

            const board = document.getElementById('gameBoard');
            if (board) {
                board.classList.remove('board-success-glow', 'board-error-flash');
                void board.offsetWidth;
                board.classList.add('board-success-glow');
            }

            triggerClickBurst(clientX, clientY, true);

            if (hotspotEl) {
                hotspotEl.classList.add('hotspot-found');
            } else if (target.id === 'floor') {
                const floorCanvas = document.getElementById('floorHighlightCanvas');
                if (floorCanvas) {
                    floorCanvas.style.opacity = '1';
                    setTimeout(() => { floorCanvas.style.opacity = '0'; }, 900);
                }
            }

            if (isFirstTimeFound) {
                addPermanentLabel(target);
            }

            renderStars();
            renderWordCards();

            // 觸發迷你彩帶慶祝
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 28,
                    spread: 55,
                    origin: {
                        x: clientX / window.innerWidth,
                        y: clientY / window.innerHeight
                    }
                });
            }

            const randomPraise = PRAISE_FILES[Math.floor(Math.random() * PRAISE_FILES.length)];
            playAudioSequence(['correct.mp3', randomPraise], () => {
                state.isProcessing = false;
                if (state.foundWords.size === VOCABULARY.length) {
                    showVictory();
                } else {
                    // 答對後清除目前選題狀態，等待老師親自點選下一個要考的單字卡
                    state.currentTarget = null;
                    const display = document.getElementById('targetWordDisplay');
                    if (display) {
                        display.textContent = 'Select a word';
                    }
                    renderWordCards();
                }
            });
        }

        /**
         * 處理答錯時的搖晃特效與雙段提示音效
         */
        function handleWrongAnswer(clientX, clientY) {
            state.isProcessing = true;
            state.attempts++;

            const board = document.getElementById('gameBoard');
            if (board) {
                board.classList.remove('board-error-flash', 'board-success-glow');
                void board.offsetWidth;
                board.classList.add('board-error-flash');
            }

            triggerClickBurst(clientX, clientY, false);

            playAudioSequence(['error.mp3', 'try again.mp3'], () => {
                state.isProcessing = false;
            });
        }

        /**
         * 在已找到的物件上留下英文單字標籤
         */
        function addPermanentLabel(target) {
            const labelsLayer = document.getElementById('labelsLayer');
            const stageConfig = STAGES[state.currentStage] || STAGES[1];
            const coords = stageConfig.labels[target.id];
            if (!labelsLayer || !coords) return;

            const badge = document.createElement('div');
            badge.className = 'absolute -translate-x-1/2 -translate-y-1/2 bg-emerald-500/95 text-white font-bold text-xs sm:text-sm px-2.5 py-0.5 rounded-full shadow-md border-2 border-white flex items-center gap-1';
            badge.style.left = coords.labelX + '%';
            badge.style.top = coords.labelY + '%';
            badge.innerHTML = `<i class="fa-solid fa-check text-[10px]"></i><span>${target.word}</span>`;
            labelsLayer.appendChild(badge);
        }

        /**
         * 點擊位置波紋特效
         */
        function triggerClickBurst(clientX, clientY, isSuccess) {
            const board = document.getElementById('gameBoard');
            if (!board) return;

            const rect = board.getBoundingClientRect();
            const ring = document.createElement('div');
            ring.className = 'click-burst-ring';
            ring.style.left = (clientX - rect.left) + 'px';
            ring.style.top = (clientY - rect.top) + 'px';
            ring.style.border = isSuccess ? '4px solid #22c55e' : '4px solid #f43f5e';
            ring.style.backgroundColor = isSuccess ? 'rgba(34, 197, 94, 0.25)' : 'rgba(244, 63, 94, 0.25)';

            board.appendChild(ring);
            setTimeout(() => ring.remove(), 700);
        }

        /**
         * 顯示過關結算畫面
         */
        function showVictory() {
            // 優先播放騰訊雲上的 win.mp3，若失敗則退回合成勝利音效
            const winAudio = new Audio(AUDIO_BASE_URL + 'win.mp3');
            state.currentAudio = winAudio;
            winAudio.onerror = () => playSoundEffect('win');
            winAudio.play().catch(() => playSoundEffect('win'));

            if (typeof confetti === 'function') {
                confetti({ particleCount: 90, spread: 80, origin: { y: 0.6 } });
            }

            const victoryOverlay = document.getElementById('victoryOverlay');
            const victoryTitle = document.getElementById('victoryTitle');
            const accuracyDisplay = document.getElementById('accuracyDisplay');
            const nextStageBtn = document.getElementById('nextStageBtn');

            const accuracy = state.attempts > 0
                ? Math.round((state.correctCount / state.attempts) * 100)
                : 100;

            if (victoryTitle) victoryTitle.textContent = `Stage ${state.currentStage} Complete!`;
            if (accuracyDisplay) accuracyDisplay.textContent = `${accuracy}%`;
            if (nextStageBtn) {
                if (state.currentStage === 1) {
                    nextStageBtn.classList.remove('hidden');
                } else {
                    nextStageBtn.classList.add('hidden');
                }
            }

            if (victoryOverlay) victoryOverlay.classList.remove('hidden');
        }

        /**
         * Web Audio API 備援音效產生器 (答對 / 答錯 / 勝利音效)
         */
        function playSoundEffect(type) {
            try {
                if (!state.audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    state.audioCtx = new AudioContext();
                }
                if (state.audioCtx.state === 'suspended') {
                    state.audioCtx.resume();
                }

                const ctx = state.audioCtx;
                const now = ctx.currentTime;

                if (type === 'correct') {
                    [523.25, 659.25, 783.99].forEach((freq, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + i * 0.08);
                        gain.gain.setValueAtTime(0.15, now + i * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.25);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + i * 0.08);
                        osc.stop(now + i * 0.08 + 0.26);
                    });
                } else if (type === 'wrong') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(190, now);
                    osc.frequency.linearRampToValueAtTime(140, now + 0.25);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.27);
                } else if (type === 'win') {
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + i * 0.12);
                        gain.gain.setValueAtTime(0.18, now + i * 0.12);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.45);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + i * 0.12);
                        osc.stop(now + i * 0.12 + 0.46);
                    });
                }
            } catch (e) {
                // 忽略瀏覽器音訊限制
            }
        }
    </script>
