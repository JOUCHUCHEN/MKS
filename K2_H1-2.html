    <style>
        body {
            font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #f0f9ff;
            overscroll-behavior: none; 
            -webkit-user-select: none; 
            user-select: none;
            background-image: radial-gradient(#bae6fd 2px, transparent 2px);
            background-size: 30px 30px;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #93c5fd; border-radius: 8px; border: 2px solid #f0f9ff; }
        
        /* 利用 Container Query (cqw/cqh) 精準計算最大 16:9 比例 */
        .slide-aspect-ratio {
            aspect-ratio: 16 / 9;
            width: min(100cqw, calc(100cqh * 16 / 9));
            height: auto;
            object-fit: contain;
        }

        /* 強制所有圖片保持原始比例 */
        #slide-img, img {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: high-quality;
            object-fit: contain !important;
        }

        #drawing-canvas {
            touch-action: none; 
            pointer-events: none; 
        }
        
        #drawing-canvas.active {
            pointer-events: auto; 
        }

        .tool-btn.active {
            background-color: #fef08a; 
            color: #b45309;
            border-color: #fde047;
            transform: scale(1.05);
        }

        .modal-enter {
            opacity: 0;
            transform: scale(0.95);
        }
        .modal-enter-active {
            opacity: 1;
            transform: scale(1);
            transition: opacity 300ms, transform 300ms;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px) rotate(-4deg); }
            50% { transform: translateX(6px) rotate(4deg); }
            75% { transform: translateX(-6px) rotate(-4deg); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake-centered {
            0%, 100% { transform: translate(-50%, -50%); }
            25% { transform: translate(calc(-50% - 6px), -50%) rotate(-4deg); }
            50% { transform: translate(calc(-50% + 6px), -50%) rotate(4deg); }
            75% { transform: translate(calc(-50% - 6px), -50%) rotate(-4deg); }
        }
        .animate-shake-centered {
            animation: shake-centered 0.4s ease-in-out;
        }

        @keyframes slideRight {
            0% { transform: translateX(0); }
            100% { transform: translateX(var(--slide-dist, 28cqw)); }
        }
        .animate-slide-right {
            animation: slideRight 1.5s linear forwards; 
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>

    <script>
        const AUDIO_GAIN_MULTIPLIER = 1.5;

        let audioContext = null;
        const audioNodes = new WeakMap(); 

        function initAudioContext() {
            if (!audioContext) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioContext = new AudioContext();
                }
            }
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        function applyGainNode(mediaElement, gainMultiplier) {
            if (!audioContext) return;
            if (audioNodes.has(mediaElement)) {
                 audioNodes.get(mediaElement).gainNode.gain.value = gainMultiplier;
                 return;
            }
            try {
                if (!mediaElement.crossOrigin) {
                     mediaElement.crossOrigin = "anonymous";
                }
                const source = audioContext.createMediaElementSource(mediaElement);
                const gainNode = audioContext.createGain();
                gainNode.gain.value = gainMultiplier;
                source.connect(gainNode);
                gainNode.connect(audioContext.destination);
                audioNodes.set(mediaElement, { source, gainNode });
            } catch (error) {
                console.warn("無法為此媒體套用音量增強:", error);
            }
        }
