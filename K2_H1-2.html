            -webkit-user-select: none;

            background-image: radial-gradient(#bae6fd 2px, transparent 2px);
            background-size: 30px 30px;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #93c5fd; border-radius: 8px; border: 2px solid #f0f9ff; }
        
        .slide-aspect-ratio {
            aspect-ratio: 16 / 9;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
        }

        #drawing-canvas {
            touch-action: none; 
            pointer-events: none; 
        }
        
        #drawing-canvas.active {
            pointer-events: auto; 
        }

        .tool-btn.active {
            background-color: #fef08a; 
            color: #b45309;
            border-color: #fde047;
            transform: scale(1.05);
        }

        .modal-enter {
            opacity: 0;
            transform: scale(0.95);
        }
        .modal-enter-active {
            opacity: 1;
            transform: scale(1);
            transition: opacity 300ms, transform 300ms;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px) rotate(-4deg); }
            50% { transform: translateX(6px) rotate(4deg); }
            75% { transform: translateX(-6px) rotate(-4deg); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake-centered {
            0%, 100% { transform: translate(-50%, -50%); }
            25% { transform: translate(calc(-50% - 6px), -50%) rotate(-4deg); }
            50% { transform: translate(calc(-50% + 6px), -50%) rotate(4deg); }
            75% { transform: translate(calc(-50% - 6px), -50%) rotate(-4deg); }
        }
        .animate-shake-centered {
            animation: shake-centered 0.4s ease-in-out;
        }

        @keyframes slideRight {
            0% { transform: translateX(0); }
            100% { transform: translateX(var(--slide-dist, 28vw)); }
        }
        .animate-slide-right {
            animation: slideRight 1.5s linear forwards; 
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
    </style>

        let audioContext = null;
        // 使用 WeakMap 來記錄已經建立過 AudioContext 節點的媒體元素，避免重複建立導致錯誤
        const audioNodes = new WeakMap(); 

        function initAudioContext() {
            if (!audioContext) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioContext = new AudioContext();
                }
            }
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        function applyVolumeEnhancement(mediaElement, multiplier) {
            if (!audioContext) return;

            // 若已經連接過節點，直接修改增益值並返回
            if (audioNodes.has(mediaElement)) {
                audioNodes.get(mediaElement).gainNode.gain.value = multiplier;
                return;
            }

            try {
                const source = audioContext.createMediaElementSource(mediaElement);
                const gainNode = audioContext.createGain();
                
                gainNode.gain.value = multiplier;
                
                source.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                audioNodes.set(mediaElement, { source, gainNode });
            } catch (error) {
                console.warn("無法增強此媒體音量 (可能因跨網域CORS限制):", error);
            }
        }

            dom.slideImg.onerror = function() { handleImageError(); };

            canvas = dom.canvas;
            ctx = canvas.getContext('2d', { willReadFrequently: true });
            
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            window.addEventListener('mouseup', stopDrawing);
            
            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            window.addEventListener('touchend', stopDrawing);

            window.addEventListener('resize', resizeCanvas);
            
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') prevPage();
                if (e.key === 'ArrowRight') nextPage();
            });

            // 载入课件基础信息
            dom.courseTitle.textContent = currentCourse.id;
            dom.totalPagesIndicator.textContent = totalPages;
            
            dom.pageSelect.innerHTML = '';
            for (let i = 1; i <= totalPages; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = `第 ${i} 页`;
                dom.pageSelect.appendChild(option);
            }

            // 綁定用戶全局點擊事件以啟動 AudioContext
            document.body.addEventListener('click', initAudioContext, { once: true });
            document.body.addEventListener('touchstart', initAudioContext, { once: true });

            // 延迟渲染以确保 DOM 就绪
            setTimeout(() => {
                resizeCanvas();
                loadPageData();
            }, 50);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                requestFullscreen(dom.courseView);
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function requestFullscreen(element) {
            if (element.requestFullscreen) {
                element.requestFullscreen().catch(err => console.log("全屏请求被拒绝", err));
            } else if (element.webkitRequestFullscreen) {
                element.webkitRequestFullscreen();
            } else if (element.msRequestFullscreen) {
                element.msRequestFullscreen();
            }
        }
        
        function prevPage() {
            if (currentPage > 1) {
                saveCurrentCanvasState();
                currentPage--;
                loadPageData();
            }
        }

        function nextPage() {
            if (currentPage < totalPages) {
                saveCurrentCanvasState();
                currentPage++;
                loadPageData();
            }
        }

        function jumpToPage(pageStr) {
            const page = parseInt(pageStr, 10);
            if (page >= 1 && page <= totalPages && page !== currentPage) {
                saveCurrentCanvasState();
                currentPage = page;
                loadPageData();
            }
        }

        function preloadNextAndPrevImages() {
            // 背景偷偷下載上一頁與下一頁的圖片，解決中國大陸網路慢造成的翻頁卡頓
            if (currentPage < totalPages) {
                const imgNext = new Image();
                imgNext.src = `${currentCourse.path}/img/投影片${currentPage + 1}.png`;
            }
            if (currentPage > 1) {
                const imgPrev = new Image();
                imgPrev.src = `${currentCourse.path}/img/投影片${currentPage - 1}.png`;
            }
        }

        function loadPageData() {
            dom.pageIndicator.textContent = currentPage;
            dom.pageSelect.value = currentPage;
            dom.prevBtn.disabled = currentPage === 1;
            dom.nextBtn.disabled = currentPage === totalPages;

            // 切換頁面時，先隱藏互動元素，避免在背景圖載入前出現
            dom.interactiveLayer.innerHTML = '';
            dom.slideImg.classList.add('hidden');
            dom.fallbackContent.classList.add('hidden');

            const filename = `${currentCourse.path}/img/投影片${currentPage}.png`;
            
            // 使用 Image 物件預先載入當前背景圖
            const img = new Image();
            img.onload = function() {
                dom.slideImg.src = filename;
                dom.slideImg.classList.remove('hidden');
                // 背景圖載入完成後，再渲染互動元素
                renderInteractiveElements();
                restoreCanvasState();
                // 成功載入當前頁後，開始預載入下一頁和上一頁
                preloadNextAndPrevImages();
                
                // 優化：在此頁面載入完成後，如果此頁面有影片，可以觸發瀏覽器背景預載入
                preloadVideoForCurrentPage();
            };
            img.onerror = function() {
                handleImageError();
                // 即使圖片載入失敗，仍渲染互動元素
                renderInteractiveElements();
                restoreCanvasState();
            };
            img.src = filename;
        }

        function preloadVideoForCurrentPage() {
            const courseConfig = pageConfigs;
            if (courseConfig && courseConfig[currentPage]) {
                const elements = courseConfig[currentPage].elements;
                const videoEl = elements.find(el => el.type === 'video-btn' || el.type === 'video-direct');
                if (videoEl && videoEl.src) {
                    dom.courseVideo.src = videoEl.src;
                    dom.courseVideo.load(); // 提示瀏覽器開始載入
                }
            }
        }

        function handleImageError() {
            dom.slideImg.classList.add('hidden');
            dom.fallbackContent.classList.remove('hidden');
            dom.missingFileName.textContent = `${currentCourse.path}/img/投影片${currentPage}.png`;
        }

        function resizeCanvas() {
            const rect = dom.slideWrapper.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            
            updateCanvasContext();
            restoreCanvasState();
        }

        function updateCanvasContext() {
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            if (currentTool === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.lineWidth = 40; 
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = currentColor;
                ctx.lineWidth = currentLineWidth;
            }
        }

        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            let clientX, clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function startDrawing(e) {
            if (e.type === 'mousedown' && e.button !== 0) return;
            isDrawing = true;
            const coords = getCoordinates(e);
            lastX = coords.x;
            lastY = coords.y;
            
            updateCanvasContext();
            ctx.beginPath();
            ctx.arc(lastX, lastY, ctx.lineWidth / 2, 0, Math.PI * 2);
            ctx.fillStyle = currentTool === 'eraser' ? 'rgba(0,0,0,1)' : currentColor;
            if (currentTool === 'pen') {
               ctx.fill();
            } else {
               ctx.save();
               ctx.globalCompositeOperation = 'destination-out';
               ctx.fill();
               ctx.restore();
            }
        }

        function draw(e) {
            if (!isDrawing) return;
            const coords = getCoordinates(e);
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(coords.x, coords.y);
            ctx.stroke();
            lastX = coords.x;
            lastY = coords.y;
        }

        function stopDrawing() {
            if (isDrawing) {
                isDrawing = false;
                ctx.closePath();
            }
        }

        function handleTouchStart(e) {
            e.preventDefault(); 
            startDrawing(e);
        }

        function handleTouchMove(e) {
            e.preventDefault(); 
            draw(e);
        }

        function toggleDrawingMode() {
            isDrawingMode = !isDrawingMode;
            if (isDrawingMode) {
                dom.canvas.classList.add('active');
                dom.drawingToolsContainer.classList.remove('opacity-50', 'pointer-events-none');
                dom.toolToggleBtn.classList.add('active');
                dom.canvas.style.cursor = currentTool === 'eraser' ? 'cell' : 'crosshair';
                showToast('已启用涂鸦模式');
            } else {
                dom.canvas.classList.remove('active');
                dom.drawingToolsContainer.classList.add('opacity-50', 'pointer-events-none');
                dom.toolToggleBtn.classList.remove('active');
                dom.canvas.style.cursor = 'default';
                showToast('已关闭涂鸦模式');
                stopDrawing(); 
            }
        }

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            const activeBtn = document.getElementById(`tool-${tool}`);
            activeBtn.classList.add('active');
            canvas.style.cursor = tool === 'eraser' ? 'cell' : 'crosshair';
            updateCanvasContext();
        }

        function setColor(color) {
            currentColor = color;
            if (currentTool === 'eraser') setTool('pen'); 
            updateCanvasContext();
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.remove('ring-white');
                btn.classList.add('ring-transparent');
            });
            const activeBtn = document.querySelector(`.color-btn[data-color="${color}"]`);
            if (activeBtn) {
                activeBtn.classList.remove('ring-transparent');
                activeBtn.classList.add('ring-white');
            }
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            showToast('画布已清空');
        }

        function getCanvasStateKey() {
            return `${currentCourse.id}_page_${currentPage}`;
        }

        function saveCurrentCanvasState() {
            const key = getCanvasStateKey();
            if (!key) return;
            drawingState[key] = canvas.toDataURL();
        }

        function restoreCanvasState() {
            const key = getCanvasStateKey();
            if (!key) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (drawingState[key]) {
                const img = new Image();
                img.onload = function() {
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                };
                img.src = drawingState[key];
            }
        }

        function renderInteractiveElements() {
            const layer = dom.interactiveLayer;
            layer.innerHTML = ''; 
            stopAudio(); 

            const courseConfig = pageConfigs;
            if (courseConfig && courseConfig[currentPage]) {
                const elements = courseConfig[currentPage].elements;
                elements.forEach(el => {
                    if (el.type === 'audio') {
                        const btn = document.createElement('button');
                        btn.className = 'absolute pointer-events-auto bg-sky-100 hover:bg-white text-sky-700 rounded-full flex items-center justify-center shadow-[0_0_20px_rgba(186,230,253,0.9)] transition-transform hover:scale-110 active:scale-95 z-10 w-12 h-12 md:w-16 md:h-16 border-4 border-white/90 backdrop-blur-sm';
                        btn.style = el.style;
                        btn.innerHTML = `<i class="ph-fill ${el.icon} text-3xl md:text-4xl text-sky-500"></i>`;
                        btn.title = '播放发音';
                        btn.onclick = () => playRealAudio(el.src, btn);
                        layer.appendChild(btn);
                    }
                    else if (el.type === 'word') {
                        const word = document.createElement('div');
                        word.className = 'absolute pointer-events-auto cursor-pointer text-slate-800 hover:text-sky-600 transition-colors z-10 drop-shadow-md font-bold';
                        word.style = `${el.style} font-family: 'Comic Sans MS', cursive, sans-serif;`;
                        word.textContent = el.text;
                        word.onclick = () => {
                            word.classList.remove('animate-shake');
                            void word.offsetWidth; 
                            word.classList.add('animate-shake');
                            playRealAudio(el.src, null);
                        };
                        layer.appendChild(word);
                    }
                    else if (el.type === 'video-btn') {
                        const btn = document.createElement('img');
                        btn.className = 'absolute pointer-events-auto cursor-pointer w-12 h-12 md:w-16 md:h-16 hover:scale-110 transition-transform z-10 shadow-lg rounded-full bg-white/50 backdrop-blur-sm p-1';
                        btn.src = 'K2H0102/img/播放键.png';
                        btn.style = `${el.style} transform: translate(-50%, -50%);`; 
                        btn.onerror = function() { this.src = 'https://cdn-icons-png.flaticon.com/512/148/148744.png'; }
                        btn.onclick = () => openCustomVideoModal(el.src, 'small');
                        layer.appendChild(btn);
                    }
                    else if (el.type === 'video-direct') {
                        const spot = document.createElement('div');
                        spot.className = 'absolute pointer-events-auto cursor-pointer z-10';
                        spot.style = el.style;
                        spot.onclick = () => openCustomVideoModal(el.src, 'full');
                        layer.appendChild(spot);
                    }
                    else if (el.type === 'link') {
                        const link = document.createElement('div');
                        link.className = 'absolute pointer-events-auto cursor-pointer z-10 w-full h-full';
                        link.style = el.style || 'top: 0; left: 0;';
                        link.onclick = () => window.open(el.url, '_blank'); 
                        layer.appendChild(link);
                    }
                    else if (el.type === 'letter') {
                        const img = document.createElement('img');
                        img.className = 'absolute pointer-events-auto cursor-pointer max-w-[70%] max-h-[70%] object-contain hover:scale-105 transition-transform z-10 drop-shadow-xl';
                        img.style = el.style;
                        img.src = el.imgSrc;
                        img.onclick = () => {
                            const isCentered = el.style.includes('translate(-50%, -50%)');
                            const shakeClass = isCentered ? 'animate-shake-centered' : 'animate-shake';
                            
                            img.classList.remove(shakeClass);
                            void img.offsetWidth;
                            img.classList.add(shakeClass);
                            playRealAudio(el.audioSrc, null);
                        }
                        layer.appendChild(img);
                    }
                    else if (el.type === 'blending') {
                        const container = document.createElement('div');
                        container.className = 'absolute pointer-events-auto z-10 w-[40%] h-[20%]';
                        container.style = el.style;
                        
                        const hand = document.createElement('img');
                        hand.src = 'K2H0102/img/point.png';
                        hand.className = 'absolute cursor-pointer w-12 md:w-16 h-auto bottom-0 left-0 hover:scale-110 transition-transform drop-shadow-md';
                        hand.onerror = function() { this.src = 'https://cdn-icons-png.flaticon.com/512/801/801755.png'; };
                        
                        if (el.slideDist) {
                            hand.style.setProperty('--slide-dist', el.slideDist);
                        }
                        
                        if (el.audios) {
                            el.audios.forEach(src => {
                                const audio = new Audio();
                                audio.src = src;
                                audio.preload = 'auto'; 
                                audio.crossOrigin = "anonymous"; // 支持 AudioContext 增音
                            });
                        }
                        
                        hand.onclick = () => {
                            hand.classList.remove('animate-slide-right');
                            void hand.offsetWidth;
                            hand.classList.add('animate-slide-right');
                            playSequentialAudio(el.audios, hand);
                        };
                        
                        container.appendChild(hand);
                        layer.appendChild(container);
                    }
                });
            }
        }

        function stopAudio() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            document.querySelectorAll('.ph-pause-circle').forEach(icon => {
                icon.classList.remove('ph-pause-circle', 'animate-pulse');
                icon.classList.add('ph-play-circle');
            });
        }

        function playRealAudio(src, btnElement) {
            initAudioContext(); // 確保 AudioContext 已啟動

            if (currentAudio && currentAudio.dataset.src === src) {
                if (currentAudio.paused) {
                    currentAudio.play();
                    updateAudioIcon(btnElement, true);
                } else {
                    currentAudio.pause();
                    updateAudioIcon(btnElement, false);
                }
                return;
            }

            stopAudio(); 
            
            currentAudio = new Audio(src);
            currentAudio.dataset.src = src; 
            currentAudio.volume = 1.0; 
            // 重要：加入跨域宣告以允許 Web Audio API 解析並增強音量
            currentAudio.crossOrigin = "anonymous"; 
            
            // 套用音量增強 (1.8倍)
            applyVolumeEnhancement(currentAudio, AUDIO_GAIN_MULTIPLIER);
            
            currentAudio.play().catch(e => {
                console.log("音频播放被阻止或找不到文件", e);
                showToast('提示：找不到音频文件，或播放被浏览器阻止。');
            });
            
            updateAudioIcon(btnElement, true);
            
            currentAudio.onended = () => {
                updateAudioIcon(btnElement, false);
                currentAudio = null;
            };
        }

        function updateAudioIcon(btnElement, isPlaying) {
            if (!btnElement) return;
            const icon = btnElement.querySelector('i');
            if (icon) {
                if (isPlaying) {
                    icon.classList.remove('ph-play-circle');
                    icon.classList.add('ph-pause-circle', 'animate-pulse');
                } else {
                    icon.classList.remove('ph-pause-circle', 'animate-pulse');
                    icon.classList.add('ph-play-circle');
                }
            }
        }

        function playSequentialAudio(srcArray, animatedElement) {
            stopAudio();
            initAudioContext(); // 確保 AudioContext 已啟動
            
            if(!srcArray || srcArray.length === 0) return;
            
            let currentIndex = 0;
            
            function playNext() {
                if (currentIndex >= srcArray.length) {
                    if(animatedElement) animatedElement.classList.remove('animate-slide-right');
                    return;
                }
                
                currentAudio = new Audio(srcArray[currentIndex]);
                currentAudio.volume = 1.0; 
                currentAudio.crossOrigin = "anonymous"; // 允許 Web Audio API 增強音量
                
                // 套用音量增強 (1.8倍)
                applyVolumeEnhancement(currentAudio, AUDIO_GAIN_MULTIPLIER);
                
                currentAudio.play().catch(e => console.log(e));
                
                currentAudio.onended = () => {
                    currentIndex++;
                    playNext();
                };
            }
            playNext();
        }

        function openCustomVideoModal(src, size = 'full') {
            initAudioContext(); // 確保 AudioContext 已啟動

            dom.videoModal.classList.remove('hidden');
            void dom.videoModal.offsetWidth; 
            dom.videoModal.classList.remove('opacity-0');
            
            if (size === 'small') {
                dom.videoModalContent.classList.remove('w-full', 'max-w-6xl');
                dom.videoModalContent.classList.add('w-[50%]'); // 缩小50%
            } else {
                dom.videoModalContent.classList.remove('w-[50%]');
                dom.videoModalContent.classList.add('w-full', 'max-w-6xl');
            }
            
            // 優化：如果來源不同才重新指派，避免中斷已預載入的影片
            if (!dom.courseVideo.src.includes(src)) {
                dom.courseVideo.src = src;
            }
            
            dom.courseVideo.volume = 1.0; 
            
            // 嘗試為影片套用音量增強 (1.8倍)
            applyVolumeEnhancement(dom.courseVideo, VIDEO_GAIN_MULTIPLIER);
            
            // 優化：延遲播放，等待模態視窗動畫完成，避免動畫和影片渲染同時進行導致卡頓
            setTimeout(() => {
                dom.courseVideo.play().catch(e => console.log("自动播放被阻止", e));
            }, 300);
        }

        function closeVideoModal() {
            dom.videoModal.classList.add('opacity-0');
            dom.videoModalContent.classList.add('scale-95');
            
            dom.courseVideo.pause();
            
            setTimeout(() => {
                dom.videoModal.classList.add('hidden');
            }, 300);
        }

        function showToast(message) {
            dom.toast.textContent = message;
            dom.toast.classList.remove('opacity-0', 'translate-y-[-20px]');
            dom.toast.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(() => {
                dom.toast.classList.remove('opacity-100', 'translate-y-0');
                dom.toast.classList.add('opacity-0', 'translate-y-[-20px]');
            }, 2000);
        }

        window.onload = initApp;

    </script>
</body>
</html>
